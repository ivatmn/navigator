<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navigator - Главная</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">

    <style>
        body { background-color: #f4f6f9; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.08); }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #fff;
            border-right: 1px solid #dee2e6;
        }
        .main-content { padding: 20px; }
        /* Стиль для активного корневого пункта */
        .navbar-nav .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>

<!-- Верхняя навигационная панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <!-- Логотип/Название -->
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-compass me-1"></i> Navigator
            <span class="fw-normal text-white-50" style="font-size: 0.9em;"
                  th:if="${officeName != null}"
                  th:text="'(' + ${officeName} + ')'">
                (Головной офис)
            </span>
        </a>

        <!-- Корневое меню -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item" th:each="item : ${rootMenu}">
                <!-- Ссылка на тот же контроллер, но с параметром menuId, чтобы открыть его подменю -->
                <a class="nav-link"
                   th:classappend="${selectedRoot != null and selectedRoot.id == item.id} ? 'active' : ''"
                   th:href="@{/(menuId=${item.id})}">
                    <i class="bi" th:classappend="${item.icon}"></i>
                    <span th:text="${item.name}"></span>
                </a>
            </li>
        </ul>

        <!-- Блок пользователя справа -->
        <div class="d-flex align-items-center">
            <span class="text-white me-3">
                <i class="bi bi-person-circle me-1"></i> <span th:text="${username}">Пользователь</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    Выйти <i class="bi bi-box-arrow-right ms-1"></i>
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- Основной макет (Сайдбар + Контент) -->
<div class="container-fluid">
    <div class="row">

        <!-- Левый сайдбар (подменю выбранного корневого пункта) -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar py-3">
            <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-2 mb-2 text-muted text-uppercase">
                <span th:text="${selectedRoot != null ? selectedRoot.name : 'Меню'}">Меню</span>
            </h6>
            <ul class="nav flex-column px-2">
                <!-- Выводим подменю -->
                <!-- Выводим подменю -->
                <li class="nav-item" th:each="sub : ${subMenu}">
                    <!-- Если есть представление — делаем ссылку по коду -->
                    <a class="nav-link"
                       th:if="${sub.viewDefinition != null}"
                       th:href="@{'/view/' + ${sub.viewDefinition.code}}">
                        <i class="bi" th:classappend="${sub.icon}"></i>
                        <span th:text="${sub.name}"></span>
                    </a>

                    <!-- Если представления нет (папка) — просто текст без ссылки -->
                    <span class="nav-link text-muted"
                          th:if="${sub.viewDefinition == null}">
                        <i class="bi" th:classappend="${sub.icon}"></i>
                        <span th:text="${sub.name}"></span>
                    </span>
                </li>

                <!-- Если подменю пустое -->
                <li class="nav-item" th:if="${subMenu == null or #lists.isEmpty(subMenu)}">
                    <span class="nav-link text-muted small">Нет доступных пунктов</span>
                </li>
            </ul>
        </nav>

        <!-- Правая часть (Контент) -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Добро пожаловать!</h1>
            </div>

            <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>
                Выберите пункт в меню слева. Это ваша главная страница.
            </div>
        </main>

    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
