<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в Navigator</title>

    <!-- Подключаем локальный Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Подключаем иконки (если скачали локально) -->
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header i {
            font-size: 3rem;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card login-card p-4">

        <div class="login-header">
            <i class="bi bi-compass"></i>
            <h3 class="mt-2 fw-bold">Navigator</h3>
            <p class="text-muted small">Войдите в свой аккаунт</p>
        </div>

        <!-- Сообщение об ошибке -->
        <div th:if="${param.error}" class="alert alert-danger py-2 text-center" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i> Неверный логин или пароль
        </div>
        <!-- Сообщение о выходе -->
        <div th:if="${param.logout}" class="alert alert-success py-2 text-center" role="alert">
            <i class="bi bi-check-circle me-1"></i> Вы успешно вышли
        </div>

        <form th:action="@{/login}" method="post">
            <!-- CSRF токен -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Логин -->
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Логин</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Введите логин" required autofocus>
                </div>
            </div>

            <!-- Пароль -->
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Пароль</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Введите пароль" required>
                </div>
            </div>

            <!-- Кнопка -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Войти <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>
    </div>
</div>

<!-- Локальный Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
